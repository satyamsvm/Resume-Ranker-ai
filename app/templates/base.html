<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResumeRank AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('main.index') }}">ResumeRank AI</a>
    <span class="tag">Shortlist by evidence, not by keyword luck</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="foot">TF-IDF similarity + skill matching + experience + education. Scores support a human decision; they do not replace it.</footer>
</body>
</html>
